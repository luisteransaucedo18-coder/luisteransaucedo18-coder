<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" role="img" aria-labelledby="title"><title id="title">Separador azul animado</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030b19"/><stop offset="1" stop-color="#0a2144"/></linearGradient><linearGradient id="blue"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#60a5fa" stop-opacity=".32"/><stop offset="1" stop-color="#0b1833" stop-opacity=".15"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#60a5fa" stroke-opacity=".09"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><style>
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float:nth-of-type(2){animation-delay:-1.5s}.float:nth-of-type(3){animation-delay:-3s}
.flow{stroke-dasharray:40 90;stroke-width:2.5;animation:flow 2.6s linear infinite}
.wave{animation:wave 3.8s ease-in-out infinite;transform-origin:center}
.beam{animation:beam 3s linear infinite}.orbit{animation:orbit 7s linear infinite;transform-origin:970px 210px}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.8)}}
@keyframes float{0%,100%{transform:translate(0,12px)}50%{transform:translate(-8px,-22px)}}
@keyframes flow{to{stroke-dashoffset:-260}}
@keyframes wave{0%,100%{transform:translateY(8px)}50%{transform:translateY(-18px)}}
@keyframes beam{0%{transform:translateX(-280px);opacity:0}15%,85%{opacity:1}100%{transform:translateX(1280px);opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pulse,.float,.flow,.wave,.beam,.orbit{animation:none}}
</style><path d="M0 16H1200" stroke="#1e3a5f"/><path class="flow" d="M0 16H1200" stroke="url(#blue)" stroke-width="2"/><circle class="pulse" cx="600" cy="16" r="4" fill="#38bdf8"/><path class="beam" d="M0 16H180" stroke="url(#blue)" stroke-width="4" stroke-linecap="round"/></svg>