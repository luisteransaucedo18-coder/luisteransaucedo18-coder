<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="32" viewBox="0 0 1200 32" role="img" aria-labelledby="title"><title id="title">Separador azul animado</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030b19"/><stop offset="1" stop-color="#0a2144"/></linearGradient><linearGradient id="blue"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#60a5fa" stop-opacity=".32"/><stop offset="1" stop-color="#0b1833" stop-opacity=".15"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#60a5fa" stroke-opacity=".09"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}.flow{stroke-dasharray:6 18;animation:flow 16s linear infinite}.wave{animation:wave 9s ease-in-out infinite;transform-origin:center}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes flow{to{stroke-dashoffset:-240}}@keyframes wave{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.pulse,.float,.flow,.wave{animation:none}}</style><path d="M0 16H1200" stroke="#1e3a5f"/><path class="flow" d="M0 16H1200" stroke="url(#blue)" stroke-width="2"/><circle class="pulse" cx="600" cy="16" r="4" fill="#38bdf8"/></svg>