<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title"><title id="title">Construir, validar y mejorar — ondas azules animadas</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030b19"/><stop offset="1" stop-color="#0a2144"/></linearGradient><linearGradient id="blue"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#60a5fa" stop-opacity=".32"/><stop offset="1" stop-color="#0b1833" stop-opacity=".15"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#60a5fa" stroke-opacity=".09"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><style>
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float{animation:float 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.float:nth-of-type(2){animation-delay:-1.5s}.float:nth-of-type(3){animation-delay:-3s}
.flow{stroke-dasharray:40 90;stroke-width:2.5;animation:flow 2.6s linear infinite}
.wave{animation:wave 3.8s ease-in-out infinite;transform-origin:center}
.beam{animation:beam 3s linear infinite}.orbit{animation:orbit 7s linear infinite;transform-origin:970px 210px}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.8)}}
@keyframes float{0%,100%{transform:translate(0,12px)}50%{transform:translate(-8px,-22px)}}
@keyframes flow{to{stroke-dashoffset:-260}}
@keyframes wave{0%,100%{transform:translateY(8px)}50%{transform:translateY(-18px)}}
@keyframes beam{0%{transform:translateX(-280px);opacity:0}15%,85%{opacity:1}100%{transform:translateX(1280px);opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pulse,.float,.flow,.wave,.beam,.orbit{animation:none}}
</style><rect width="1200" height="160" rx="16" fill="url(#bg)"/><path class="wave" d="M0 110Q200 45 400 110T800 110T1200 110V160H0Z" fill="#2563eb" opacity=".35"/><path class="wave" style="animation-delay:-4s" d="M0 125Q200 80 400 125T800 125T1200 125" stroke="#38bdf8" fill="none" opacity=".9" stroke-width="2"/><text x="600" y="65" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Construir. Validar. Mejorar.</text><text x="600" y="94" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93c5fd">Desarrollo con criterio · Calidad en cada entrega</text><path class="beam" d="M0 148H160" stroke="url(#blue)" stroke-width="3" stroke-linecap="round"/></svg>