<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title"><title id="title">Construir, validar y mejorar — ondas azules animadas</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030b19"/><stop offset="1" stop-color="#0a2144"/></linearGradient><linearGradient id="blue"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#60a5fa" stop-opacity=".32"/><stop offset="1" stop-color="#0b1833" stop-opacity=".15"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#60a5fa" stroke-opacity=".09"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}.flow{stroke-dasharray:6 18;animation:flow 16s linear infinite}.wave{animation:wave 9s ease-in-out infinite;transform-origin:center}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes flow{to{stroke-dashoffset:-240}}@keyframes wave{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){.pulse,.float,.flow,.wave{animation:none}}</style><rect width="1200" height="160" rx="16" fill="url(#bg)"/><path class="wave" d="M0 110Q200 45 400 110T800 110T1200 110V160H0Z" fill="#2563eb" opacity=".14"/><path class="wave" style="animation-delay:-4s" d="M0 125Q200 80 400 125T800 125T1200 125" stroke="#38bdf8" fill="none" opacity=".5"/><text x="600" y="65" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#e2e8f0">Construir. Validar. Mejorar.</text><text x="600" y="94" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#93c5fd">Desarrollo con criterio · Calidad en cada entrega</text></svg>